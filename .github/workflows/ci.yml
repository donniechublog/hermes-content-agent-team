# CI cho content-team (audit lượt 2, E-r2-8 / ADF-r2-13).
#
# Hai cổng, đúng hai cổng dùng tay từ trước: pyflakes (lint) và tests/run.sh
# (37+ tệp test, harness riêng, không pytest). run.sh tự đặt CT_STATE_DIR nên
# không ghi vào state/ của repo. Chromium cần cho vài test render — cài như
# setup.sh làm trên server.
#
# Vì sao giờ mới có: lượt 1 lẫn lượt 2 audit đều thấy "xanh 37/37" mà một trong
# hai lần là xanh giả (không cách ly). Không có CI thì lượt audit 3 sẽ lặp lại
# lượt 2.
name: ci

# `branches: ["**"]` chứ không liệt kê tiền tố: danh sách cũ [main, feat/**,
# fix/**] bỏ sót sua/**, anh/**, rename/**, claude/** — đo 12/09/2026 thì
# sua/low35-thuc-the push thật 2 lần, ci.yml có sẵn trong cây, vẫn 0 run, và
# nhánh đó đang đỏ lint. Whitelist theo tiền tố sẽ lại sót ở kiểu đặt tên sau.
# Cổng `pull_request` KHÔNG đỡ hộ được: 34/34 run tới nay đều event=push. Repo
# CÓ 5 PR (#1–#5) nhưng tất cả merge xong 29/08–05/09, tức trước khi ci.yml ra
# đời (10/09), nên cổng pull_request chưa từng chạy lần nào (LOW-43).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      # Cài từ requirements.lock (LOW-300), không phải requirements.txt: `>=` để CI mỗi
      # lần cài có thể ra bản khác máy chủ. Lock sinh từ venv máy chủ (Python 3.11, cùng
      # bản CI), cách làm mới ở đầu requirements.txt. `pip check` bắt lock thiếu một
      # phụ thuộc bắc cầu. pyflakes là công cụ lint, không thuộc lock.
      - name: Cài gói
        run: |
          python -m pip install -q -r requirements.lock pyflakes
          python -m pip check
          python -m playwright install --with-deps chromium
      # Chỉ báo cáo (LOW-300): continue-on-error nên lỗ hổng tìm thấy làm bước này báo lỗi
      # nhưng KHÔNG làm đỏ job hay chặn merge. Chạy trước pyflakes để báo cáo vẫn
      # ra khi lint hỏng. pipx run: pip-audit nằm trong venv riêng, không chen vào môi
      # trường test. --no-deps --disable-pip: lock đã ghim đủ bắc cầu nên không cần cài lại
      # 18 gói vào một venv tạm chỉ để quét.
      - name: pip-audit (chỉ báo cáo)
        continue-on-error: true
        run: pipx run pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
      # Cả thư mục `hermes`, không liệt kê từng skill (LOW-298): danh sách cũ chỉ có
      # url-mascot-frame, nên social-crawl/scripts/social_fetch.py dùng `re` mà không
      # import vẫn qua CI suốt 12 ngày (08/09 → 20/09/2026). pyflakes tự đệ quy thư mục.
      - name: pyflakes
        run: python -m pyflakes *.py prepare tests hermes
      - name: tests/run.sh
        env:
          PY: python
          PYTHONUTF8: "1"
        run: bash tests/run.sh
