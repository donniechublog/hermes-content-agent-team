# CI cho content-team (audit lượt 2, E-r2-8 / ADF-r2-13).
#
# Hai cổng, đúng hai cổng dùng tay từ trước: pyflakes (lint) và tests/chay.sh
# (37+ tệp test, harness riêng, không pytest). chay.sh tự đặt CT_STATE_DIR nên
# không ghi vào state/ của repo. Chromium cần cho vài test render — cài như
# cai_dat.sh làm trên server.
#
# Vì sao giờ mới có: lượt 1 lẫn lượt 2 audit đều thấy "xanh 37/37" mà một trong
# hai lần là xanh giả (không cách ly). Không có CI thì lượt audit 3 sẽ lặp lại
# lượt 2.
name: kiem

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài gói
        run: |
          python -m pip install -q -r requirements.txt pyflakes
          python -m playwright install --with-deps chromium
      - name: pyflakes
        run: python -m pyflakes *.py chuan_bi/*.py tests/*.py hermes/skills/url-mascot-frame/scripts/*.py
      - name: tests/chay.sh
        env:
          PY: python
          PYTHONUTF8: "1"
        run: bash tests/chay.sh
